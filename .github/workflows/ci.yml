name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packages import each other's built output, so build before anything type-aware.
      - name: Build
        run: pnpm build
      # Format, lint, and typecheck.
      - name: Check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Doctor
        run: pnpm run doctor
      - name: Docs
        run: pnpm docs:generate
      - name: Worker bundle
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run
      # The oldest Node supported by Vite+ 1.1.0. pnpm and the docs build need a newer one, so this runs last and calls vp directly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
      - name: Test on Node 22.18
        run: node_modules/.bin/vp test

  # This budget includes the full docs build and Chromium installation before the browser suite.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Docs
        run: pnpm docs:build
      - name: Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: End to end
        run: pnpm test:e2e
