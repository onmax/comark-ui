packages:
  - "packages/*"
  - "docs"

catalogMode: prefer

# The ViteHub builds come from pkg.pr.new, whose packages depend on each other by URL, which pnpm refuses as
# sub-dependencies unless this is off.
blockExoticSubdeps: false
# The code that ViteHub generates into docs/.vitehub imports its @vite-hub/* packages by name, from the docs app.
publicHoistPattern:
  - "@vite-hub/*"
  - nitro

