  "@vite-hub/rate-limit": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/rate-limit@2862ffe428dde04c5d64d76b7b26e5224a170e17
  "@vite-hub/realtime": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/realtime@2862ffe428dde04c5d64d76b7b26e5224a170e17
  "@vite-hub/runtime": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/runtime@2862ffe428dde04c5d64d76b7b26e5224a170e17
