  "@vite-hub/database": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/database@298ec15c001397e11774a2d1de78e0c3d495b137
  "@vite-hub/decisions": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/decisions@298ec15c001397e11774a2d1de78e0c3d495b137
  "@vite-hub/docs": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/docs@298ec15c001397e11774a2d1de78e0c3d495b137
  "@vite-hub/email": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/email@298ec15c001397e11774a2d1de78e0c3d495b137
