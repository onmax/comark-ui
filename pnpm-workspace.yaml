  comark-ui: workspace:*
  vite: "catalog:"
  # The preview packages take each other as peers at "0.1.0 || 0.0.0-preview-…", and pnpm fills a missing peer from
  # npm's 0.1.0. Every @vite-hub/* package comes from the same commit as the catalog's instead.
  "@vite-hub/agent": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/agent@719f69a7224cae83895e276a7e59295b29b18414
  "@vite-hub/auth": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/auth@719f69a7224cae83895e276a7e59295b29b18414
