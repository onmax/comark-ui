minimumReleaseAgeExclude:
  - vite-doctor@0.1.0
  - "@comark/html@0.8.1"
  - "@comark/react@0.8.1"
  - "@comark/vue@0.8.1"
  - comark@0.8.1

allowBuilds:
  # ViteHub's optional dependencies (zstd, swc, cbor-extract, cpu-features, liblzma, ssh2) are not used by the docs.
  "@mongodb-js/zstd": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: true
  node-liblzma: false
  ssh2: false
  workerd: true

# Temporary dependency backports. See patches/README.md for upstream PRs and removal conditions.
patchedDependencies:
  comark@0.8.1: patches/comark.patch
