minimumReleaseAgeExclude:
  - vite-doctor@0.1.0
  - "@comark/html@0.9.0"
  - "@comark/react@0.9.0"
  - "@comark/svelte@0.9.0"
  - "@comark/vue@0.9.0"
  - comark@0.9.0

allowBuilds:
  # ViteHub's optional dependencies (zstd, swc, cbor-extract, cpu-features, liblzma, ssh2) are not used by the docs.
  "@mongodb-js/zstd": false
  "@swc/core": false
  cbor-extract: false
  # Its postinstall only prints a funding message.
  core-js-pure: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: true
  node-liblzma: false
  ssh2: false
  # @vite-hub/docs pulls it through @vueuse; its postinstall only picks the Vue 2 or 3 build, and Vue 3 is its default.
  vue-demi: false
  workerd: true

# Temporary dependency backports. See patches/README.md for upstream PRs and removal conditions.
patchedDependencies:
  "@vite-hub/docs@0.0.0-preview-298ec15": patches/@vite-hub__docs@0.0.0-preview-298ec15.patch
  # Workers builds resolve the `workerd` condition, which 5.0.1 lacks (crouchcd/pkce-challenge#50, merged, unreleased).
  pkce-challenge@5.0.1: patches/pkce-challenge@5.0.1.patch
