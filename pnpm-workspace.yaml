  "@vite-hub/ui": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/ui@2862ffe428dde04c5d64d76b7b26e5224a170e17
  "@vite-hub/workflow": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/workflow@2862ffe428dde04c5d64d76b7b26e5224a170e17
