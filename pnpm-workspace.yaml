packages:
  - "packages/*"
  - "docs"

catalogMode: prefer

# The ViteHub preview builds are URLs, which pnpm refuses as sub-dependencies unless this is off.
blockExoticSubdeps: false
# The code that ViteHub generates into docs/.vitehub imports its @vite-hub/* packages by name, from the docs app.
publicHoistPattern:
  - "@vite-hub/*"
  - nitro

catalog:
  "@fontsource-variable/caveat": ^5.3.0
  "@iconify-json/lucide": ^1.2.100
  "@iconify/types": ^2.0.0
  "@iconify/utils": ^3.1.7
  "@playwright/test": ^1.64.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@comark/react": ^0.8.1
  "@comark/svelte": ^0.8.1
  "@comark/vue": ^0.8.1
  ai: ^7.0.130
  react: ^19.3.1
  react-dom: ^19.3.1
  svelte: ^5.57.2
  vue: ^3.5.44
  "@comark/html": ^0.8.1
  "@eslint/markdown": ^8.0.3
  eslint: ^10.13.0
  comark: ^0.8.1
  comark-pele: ^1.1.0
  flint-chart: ^0.5.1
  katex: ^0.19.1
  temml: ^0.14.0
  vega: ^6.4.0
  vega-interpreter: ^2.3.2
  vega-lite: ^6.5.0
  geist: ^1.7.2
  markdown-it-cjk-friendly: ^3.0.0
  pkg-pr-new: ^0.0.92
  publint: ^0.3.25
  shiki: ^4.5.0
  tsdown: ^0.23.1
  typescript: ^6.0.3
  vite-doctor: ^0.1.0
  "@types/node": ^24.0.0
  vite: npm:@voidzero-dev/vite-plus-core@^1.1.0
  vite-plus: ^1.1.0
  "@tiptap/core": ^3.31.4
  "@tiptap/extension-image": ^3.31.4
  "@tiptap/extension-list": ^3.31.4
  "@tiptap/extension-table": ^3.31.4
  "@tiptap/pm": ^3.31.4
  "@tiptap/starter-kit": ^3.31.4
  "@tiptap/vue-3": ^3.31.4
  "@tiptap/y-tiptap": ^3.0.9
  yjs: ^13.6.33
  nuxt-agent-discovery: ^0.8.0
  valibot: ^1.4.2
  better-auth: 1.7.10
  # The combined Content/Comments preview includes PR publishing, multi-path collections, and the upstream blob cache.
  vite-hub: https://pkg.pr.new/vite-hub/vitehub/vite-hub@2862ffe428dde04c5d64d76b7b26e5224a170e17
  drizzle-kit: ^0.31.10
  drizzle-orm: 0.45.4
  wrangler: ^4.152.0
  d3-sankey: ^0.12.3
  "@types/d3-sankey": ^0.12.5
  tsrs: 0.20.1-ts7.1.0-beta

